<!DOCTYPE html>

<html lang="es">

<head>

    ```
    <meta charset="UTF-8">

    <title>Mi Perfil</title>

    <link rel="stylesheet" href="/perfil.css">

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            <img src="/img/navbar icon.png" alt="logo">
        </div>

        <div class="usuario">

            <span class="campana" id="campana">

                🔔

                <span class="contador">
                    3
                </span>

            </span>

            <div class="usuario">

                <div class="datos-usuario">

                    <h3 id="nombreNavbar"></h3>

                    <span id="rolNavbar"></span>

                </div>

                <img class="foto" src="https://i.pravatar.cc/100" alt="perfil">

            </div>

    </nav>

    <main class="contenido">

        <a href="/dashboard-estudiante" class="btn-volver">
            Cursos
        </a>

        <div class="perfil-card">

            <div class="imagen-actual">

                <label>Imagen actual</label>

                <img id="fotoPerfil" src="https://i.pravatar.cc/150" alt="perfil">

            </div>

            <div class="formulario">

                <h2 id="nombreTitulo"></h2>

                <label>Nueva imagen</label>

                <input type="file" id="nuevaFoto">

                <label>Nombre</label>

                <input type="text" id="nombre">

                <label>Correo</label>

                <input type="email" id="email">

                <label>Rol</label>

                <input type="text" id="rol" readonly>

                <label>Nueva contraseña</label>

                <input type="password" id="password">

                <label>Confirmar contraseña</label>

                <input type="password" id="confirmPassword">

                <div class="acciones">

                    <button id="btnGuardar">
                        Guardar
                    </button>

                    <button id="btnCancelar">
                        Cancelar
                    </button>

                </div>

            </div>

        </div>

    </main>

    <script src="/perfil.js"></script>

</body>

</html>
