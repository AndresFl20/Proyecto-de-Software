<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduTech - Detalle del Curso</title>
    <link rel="stylesheet" href="/curso.css"> 
</head>
<body>

<nav class="navbar">
    <div class="logo">
        <img src="/img/navbar icon.png" alt="logo">
    </div>

    <a href="/dashboard-estudiante" class="btn-nav-cursos-fijo">Cursos</a>

    <div class="usuario">
        <span class="campana" id="campana">
            🔔 <span class="contador">3</span>
        </span>
        <div id="panelNotificaciones" class="panel-notificaciones">
            <h3>Notificaciones</h3>
            <div id="listaNotificaciones"></div>
            <div class="ver-todo">Ver todo</div>
        </div>
        <div class="datos-usuario" id="perfilUsuario">
            <h3 id="nombreUsuario">ALEJANDRO RODRIGUEZ</h3>
            <span id="rolUsuario">estudiante</span>
        </div>
        <img id="fotoUsuario" class="foto" src="https://i.pravatar.cc/100" alt="perfil">
        <span class="flecha">▼</span>
    </div>
</nav>

    <div class="layout-curso-detalle">
        
        <aside class="sidebar-actividades">
            <div class="dropdown-actividad-header">
                <span>Actividad</span>
                <span class="flecha-filtro">▲</span>
            </div>
            <div id="lista-actividades-container">
                </div>
        </aside>

        <main class="contenido-curso">
            
            <div class="banner-curso-header">
                <h1 id="curso-titulo">Cargando curso...</h1>
                <h3 id="curso-docente">Cargando docente...</h3>
            </div>
            
            <div class="tarjeta-blanca-detalle" id="contenido-dinamico">
    <h2 id="bienvenida-titulo">Cargando presentación del curso...</h2>
    <div id="bienvenida-texto">
        <p>Por favor, espere mientras traemos la información del servidor...</p>
    </div>
        </main>
    </div>

    <script src="/curso-detalle.js"></script>
</body>
</html>
