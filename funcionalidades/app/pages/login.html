<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página</title>
    <link rel ="stylesheet" href="style.css">
    <script src="login.js" defer></script>

</head>

<body class="page-login">

<form id="login-form" class="container">

    <img src="/img/logo.PNG" class="logo" alt="EduTech">

    <h2>Iniciar Sesión</h2>

    <div class="input-group">
        <input type="email" id="email" name="email" placeholder="example@edutech.com" required>
    </div>

    <div class="input-group">
        <input type="password" id="password" name="password" placeholder="********" required>
        <span class="icon" onclick="togglePassword()"></span>
    </div>

    <button type="submit">Ingresar</button>

    <div class="links">
        <p><a href="#">¿Olvidó sus credenciales?</a></p>
        <p><a href="/register">Regístrate aquí</a></p>
    </div>

</form>

<script src="/login.js"></script>

</body>

</html>
