<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro EduTech - Diseño</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-register">

    <div class="register-container">
        <div class="logo-container">
            <div class="logo-placeholder">
                <i class="fas fa-shield-alt" style="font-size: 60px; color: #1565c0;"></i>
                <div><span style="color: #1565c0">Edu</span><span style="color: #4CAF50">Tech</span></div>
            </div>
            </div>

       <form id="register-form">
    <div class="form-group">
        <input type="text" name="nombre" class="input-field" placeholder="MARIA RODRIGUEZ" required>
    </div>

    <div class="form-group">
        <input type="email" name="email" class="input-field" placeholder="example@edutech.com" required>
    </div>

    <div class="form-group select-wrapper">
        <select name="rol" class="select-field" required>
            <option value="" disabled selected>Selecciona un rol</option>
            <option value="docente">Docente</option>
            <option value="estudiante">Estudiante</option>
            <option value="administrador">Administrador</option>
        </select>
        <i class="fas fa-caret-down select-icon"></i>
    </div>

    <div class="form-group">
        <input type="password" name="password" class="input-field password-field" id="password" placeholder="Contraseña" required>
        <i class="fas fa-eye-slash toggle-password" onclick="togglePasswordVisibility('password')"></i>
    </div>

    <div class="form-group">
        <input type="password" name="confirm-password" class="input-field password-field" id="confirm-password" placeholder="Confirmar Contraseña" required>
        <i class="fas fa-eye-slash toggle-password" onclick="togglePasswordVisibility('confirm-password')"></i>
    </div>

    <button type="submit" class="submit-button">Registrarse</button>
</form>
        </form>

        <a href="/" class="login-link">Ya tengo cuenta</a>
    </div>

    <script>
        function togglePasswordVisibility(fieldId) {
            const passwordField = document.getElementById(fieldId);
            const toggleIcon = passwordField.nextElementSibling; // El ícono i que sigue al input

            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye'); // Cambia a ojo abierto
            } else {
                passwordField.type = 'password';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash'); // Cambia a ojo cerrado
            }
        }
    </script>

    <script src="./registro.js"></script>

</body>
</html>
