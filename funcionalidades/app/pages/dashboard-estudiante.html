<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>EduTech</title>
    <link rel="stylesheet" href="/dashboard.css">
</head>

<body>

    <nav class="navbar">
        <div class="logo">
            <img src="/img/navbar icon.png" alt="logo">
        </div>

        <div class="usuario">

            <span class="campana" id="campana">
                🔔
                <span class="contador">
                    3
                </span>
            </span>

            <div id="panelNotificaciones" class="panel-notificaciones">
                <h3>Notificaciones</h3>
                <div id="listaNotificaciones"></div>
                <div class="ver-todo">
                    Ver todo
                </div>
            </div>

            <div class="datos-usuario" id="perfilUsuario">
                <h3 id="nombreUsuario">JUAN PEREZ</h3>
                <span id="rolUsuario">Estudiante</span>
            </div>

            <img id="fotoUsuario" class="foto" src="/img/default.jpg" alt="perfil">
            <span class="flecha">▼</span>

        </div>

    </nav>

    <div id="alertaPerfil"
        style="display: none; position: fixed; top: 110px; right: 30px; background: #5cb85c; color: white; padding: 15px 25px; border-radius: 6px; z-index: 9999; align-items: center; gap: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); font-family: 'Fira Sans', sans-serif; min-width: 300px; animation: fadeInRight 0.3s ease-in-out;">
        <div style="font-size: 20px; font-weight: bold;">✓</div>
        <div>
            <strong style="display: block; font-size: 15px; margin-bottom: 2px;">¡Perfil actualizado!</strong>
            <span style="font-size: 13px; opacity: 0.95;">Tus cambios han sido guardados.</span>
        </div>
    </div>

    <style>
        @keyframes fadeInRight {
            from {
                opacity: 0;
                transform: translateX(50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
    </style>

    <main class="contenido">
        <h1>Cursos</h1>

        <div class="filtros">
            <select>
                <option>Todos</option>
            </select>
            <input type="text" id="buscarCurso" placeholder="Buscar curso">
            <select id="filtroEstado">
                <option value="">Todos</option>
                <option value="activo">Activo</option>
                <option value="finalizado">Finalizado</option>
            </select>
        </div>

        <div id="contenedorCursos"></div>

    </main>

    <script src="/dashboard.js"></script>

</body>

</html>
