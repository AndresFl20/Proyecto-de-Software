<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>EduTech</title>
    <link rel="stylesheet" href="/dashboard.css">
</head>

<body>

    <nav class="navbar">
        <div class="logo">
            <img src="/img/navbar icon.png" alt="logo">
        </div>

        <div class="usuario">

            <span class="campana" id="campana">

                🔔

                <span class="contador">
                    3
                </span>

            </span>

            <div id="panelNotificaciones" class="panel-notificaciones">

                <h3>Notificaciones</h3>

                <div id="listaNotificaciones"></div>

                <div class="ver-todo">
                    Ver todo
                </div>

            </div>

            <div class="datos-usuario" id="perfilUsuario">

                <h3 id="nombreUsuario">
                    JUAN PEREZ
                </h3>

                <span id="rolUsuario">
                    Estudiante
                </span>

            </div>

            <img id="fotoUsuario" class="foto" src="https://i.pravatar.cc/100" alt="perfil">
            <span class="flecha">
                ▼
            </span>

        </div>

    </nav>

    <main class="contenido">
        <h1>Cursos</h1>

        <div class="filtros">
            <select>
                <option>Todos</option>
            </select>
            <input type="text" id="buscarCurso" placeholder="Buscar curso">
            <select id="filtroEstado">
                <option value="">Todos</option>
                <option value="activo">Activo</option>
                <option value="finalizado">Finalizado</option>
            </select>
        </div>

        <div id="contenedorCursos">
        </div>

    </main>

    <script src="/dashboard.js"></script>

</body>

</html>
